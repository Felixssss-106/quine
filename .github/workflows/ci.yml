name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: |
          chmod +x ./gradlew
          # 用 `test` 而不是 `testDebugUnitTest`：后者只覆盖 Android 模块的 debug 变体，
          # 纯 JVM 模块（core-common / core-gateway）的测试任务叫 `test`，会被整块跳过。
          ./gradlew --no-daemon lint test assembleDebug
